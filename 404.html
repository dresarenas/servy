<script>
// GitHub Pages no tiene routing de servidor: /p/{slug} llega acá y redirige a perfil.html?p={slug}
(function () {
  var m = location.pathname.match(/^(.*?)\/p\/([^\/]+)\/?$/);
  if (m) {
    location.replace((m[1] || '') + '/perfil.html?p=' + encodeURIComponent(m[2]));
  } else {
    location.replace('/');
  }
})();
</script>
