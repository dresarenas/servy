<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SERVY — Buscar V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:    #3CE6C5;
    --ink:       #F2EEE6;
    --ink-mute:  rgba(242,238,230,0.58);
    --bg:        #0E0F12;
    --bg-card:   #1C1E23;
    --line:      rgba(242,238,230,0.08);
    --f-display:'Bricolage Grotesque', sans-serif;
    --f-sans:   'Geist', sans-serif;
    --spring:    cubic-bezier(0.32, 0.72, 0, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-sans);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 28px;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    margin-bottom: 18px;
  }
  .topbar-logo {
    font-family: var(--f-display);
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .topbar-step {
    margin-left: auto;
    font-size: 12px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
  }

  /* ── CHIPS ZONE (completed steps) ── */
  .chips-zone {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .step-chip {
    background: rgba(60,230,197,0.06);
    border: 1px solid rgba(60,230,197,0.20);
    border-radius: 16px;
    padding: 11px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    /* starts invisible, animates in */
    opacity: 0;
    transform: translateY(-10px) scale(0.95);
    transition: opacity 0.40s var(--spring), transform 0.40s var(--spring);
  }
  .step-chip.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .step-chip:active { opacity: 0.75; }
  .chip-icon  { font-size: 18px; flex-shrink: 0; }
  .chip-body  { flex: 1; }
  .chip-val   { font-size: 13px; font-weight: 600; color: var(--accent); }
  .chip-lbl   { font-size: 10px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 1px; }
  .chip-edit  { font-size: 14px; color: rgba(242,238,230,0.28); }

  /* ── CARD ZONE ── */
  .card-zone {
    flex: 1;
    position: relative;
    margin-top: 14px;
    min-height: 0;
  }

  /* ── WIZARD CARD ── */
  .wcard {
    position: absolute;
    inset: 0;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 26px 22px 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.50);
    overflow: hidden;
  }

  .wcard.anim-enter {
    animation: anim-enter 0.56s var(--spring) forwards;
  }
  .wcard.anim-exit {
    animation: anim-exit 0.26s ease-in forwards;
    pointer-events: none;
  }
  .wcard.anim-shake {
    animation: anim-shake 0.40s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes anim-enter {
    from { transform: translateY(64px) scale(0.95); opacity: 0; }
    to   { transform: translateY(0)    scale(1);    opacity: 1; }
  }
  @keyframes anim-exit {
    from { transform: translateY(0)    scale(1);    opacity: 1; }
    to   { transform: translateY(-56px) scale(0.93); opacity: 0; }
  }
  @keyframes anim-shake {
    0%, 100% { transform: translateX(0); }
    16%  { transform: translateX(-9px); }
    36%  { transform: translateX(8px); }
    56%  { transform: translateX(-5px); }
    76%  { transform: translateX(4px); }
  }

  /* ── CARD CONTENT ── */
  .wcard-step {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px; flex-shrink: 0;
  }
  .wcard-title {
    font-family: var(--f-display);
    font-size: 26px; font-weight: 800; line-height: 1.15;
    margin-bottom: 6px; flex-shrink: 0;
  }
  .wcard-desc {
    font-size: 14px; line-height: 1.6;
    color: var(--ink-mute); margin-bottom: 20px; flex-shrink: 0;
  }

  /* ── OPTIONS GRID ── */
  .opts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex: 1;
    align-content: start;
  }
  .opt {
    background: rgba(242,238,230,0.04);
    border: 1.5px solid rgba(242,238,230,0.09);
    border-radius: 18px;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.10s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt:active  { transform: scale(0.95); }
  .opt.sel     { background: rgba(60,230,197,0.10); border-color: rgba(60,230,197,0.48); }
  .opt-ico     { font-size: 24px; }
  .opt-txt     { font-size: 14px; font-weight: 500; }
  .opt.sel .opt-txt { color: var(--accent); }

  /* ── SWIPE HINT ── */
  .swipe-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: auto;
    padding-top: 14px;
    flex-shrink: 0;
    color: var(--ink-mute);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }
  .swipe-hint.show { opacity: 1; }
  .hint-arr  { font-size: 14px; animation: float-up 1.5s ease-in-out infinite; }
  .swipe-hint span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  @keyframes float-up {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-4px); }
  }

  /* ── RESULTS ── */
  .results-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 16px;
  }
  .ri {
    display: flex; align-items: center; gap: 12px;
    background: rgba(242,238,230,0.04);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
  }
  .ri-av {
    width: 42px; height: 42px; border-radius: 50%;
    flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; font-size: 18px;
  }
  .ri-info { flex: 1; }
  .ri-name { font-size: 15px; font-weight: 600; }
  .ri-meta { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .ri-badge {
    font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 99px;
    background: rgba(60,230,197,0.15); color: var(--accent);
  }

  /* ── CTA ── */
  .btn-cta {
    width: 100%; padding: 16px;
    border-radius: 999px; border: none;
    background: var(--accent); color: #0a0a0a;
    font-family: var(--f-sans); font-size: 15px; font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s ease;
    flex-shrink: 0;
  }
  .btn-cta:active { transform: scale(0.98); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 36px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: rgba(28,30,35,0.92);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(242,238,230,0.14);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--ink);
    opacity: 0;
    transition: opacity 0.28s ease, transform 0.28s ease;
    pointer-events: none;
    white-space: nowrap;
    z-index: 200;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .wcard, .step-chip, .hint-arr { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="topbar">
    <span class="topbar-logo">SERVY</span>
    <span class="topbar-step" id="topStep">Paso 1 de 3</span>
  </header>
  <div class="chips-zone" id="chipsZone"></div>
  <div class="card-zone"  id="cardZone"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STEPS DATA ──────────────────────────────────────────
const STEPS = [
  {
    lbl: 'Problema',
    title: '¿Qué necesitás arreglar?',
    desc: 'Elegí el tipo de trabajo.',
    opts: [
      { ico:'🔧', txt:'Plomería',     val:'plomeria' },
      { ico:'⚡', txt:'Electricidad', val:'electricidad' },
      { ico:'🔥', txt:'Gas',          val:'gas' },
      { ico:'🏠', txt:'Albañilería',  val:'albanileria' },
    ],
    validate: () => !!answers[0],
    summary:  () => {
      const o = STEPS[0].opts.find(x => x.val === answers[0]);
      return o ? { ico: o.ico, txt: o.txt } : null;
    }
  },
  {
    lbl: 'Zona',
    title: '¿En qué barrio estás?',
    desc: 'Buscamos prestadores cerca tuyo.',
    opts: [
      { ico:'📍', txt:'Villa Allende',   val:'villa-allende' },
      { ico:'📍', txt:'Córdoba Capital', val:'cordoba' },
      { ico:'📍', txt:'La Calera',       val:'la-calera' },
      { ico:'📍', txt:'Otro barrio',     val:'otro' },
    ],
    validate: () => !!answers[1],
    summary:  () => {
      const o = STEPS[1].opts.find(x => x.val === answers[1]);
      return o ? { ico: o.ico, txt: o.txt } : null;
    }
  },
  { lbl: 'Resultados', isResult: true }
];

const answers   = {};
let cur         = 0;
let busy        = false; // prevent double-advance
let toastTimer  = null;

const chipsZone = document.getElementById('chipsZone');
const cardZone  = document.getElementById('cardZone');
const topStep   = document.getElementById('topStep');
const toastEl   = document.getElementById('toast');

// ── TOAST ───────────────────────────────────────────────
function showToast(msg) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

// ── ADD CHIP ────────────────────────────────────────────
function addChip(stepIdx) {
  const s = STEPS[stepIdx];
  const info = s.summary();
  if (!info) return;

  const chip = document.createElement('div');
  chip.className = 'step-chip';
  chip.dataset.step = stepIdx;
  chip.innerHTML = `
    <span class="chip-icon">${info.ico}</span>
    <div class="chip-body">
      <p class="chip-val">${info.txt}</p>
      <span class="chip-lbl">${s.lbl}</span>
    </div>
    <span class="chip-edit">✎</span>
  `;
  chip.addEventListener('click', () => { if (!busy) editStep(stepIdx); });
  chipsZone.appendChild(chip);
  // Double rAF so transition fires after element is in DOM
  requestAnimationFrame(() => requestAnimationFrame(() => chip.classList.add('visible')));
}

// ── RENDER CARD ─────────────────────────────────────────
function renderCard(stepIdx, animate) {
  const s = STEPS[stepIdx];
  topStep.textContent = `Paso ${stepIdx + 1} de ${STEPS.length}`;

  const card = document.createElement('div');
  card.className = 'wcard' + (animate ? ' anim-enter' : '');
  card.addEventListener('animationend', () => card.classList.remove('anim-enter'), { once: true });

  if (s.isResult) {
    card.innerHTML = `
      <p class="wcard-step">Paso ${stepIdx + 1} de ${STEPS.length} · ${s.lbl}</p>
      <h2 class="wcard-title">3 prestadores<br>cerca tuyo</h2>
      <div class="results-list">
        <div class="ri">
          <div class="ri-av" style="background:rgba(60,230,197,0.15)">🔧</div>
          <div class="ri-info">
            <p class="ri-name">Martín Hlavach</p>
            <p class="ri-meta">⭐ 4.9 · Plomero · 47 trabajos</p>
          </div>
          <span class="ri-badge">Verificado</span>
        </div>
        <div class="ri">
          <div class="ri-av" style="background:rgba(198,255,60,0.12)">⚡</div>
          <div class="ri-info">
            <p class="ri-name">José Rodríguez</p>
            <p class="ri-meta">⭐ 4.7 · Electricista · 31 trabajos</p>
          </div>
          <span class="ri-badge">Recomendado</span>
        </div>
        <div class="ri">
          <div class="ri-av" style="background:rgba(245,183,49,0.12)">🔥</div>
          <div class="ri-info">
            <p class="ri-name">Carlos Pérez</p>
            <p class="ri-meta">⭐ 4.6 · Gasista · 22 trabajos</p>
          </div>
          <span class="ri-badge" style="background:rgba(245,183,49,0.15);color:#F5B731">Destacado</span>
        </div>
      </div>
      <button class="btn-cta" id="ctaBtn">Ver resultados →</button>
    `;
    card.querySelector('#ctaBtn').addEventListener('click', () => {
      showToast('¡Conectando con los prestadores!');
    });
  } else {
    const optsHTML = s.opts.map(o => `
      <div class="opt ${answers[stepIdx] === o.val ? 'sel' : ''}" data-val="${o.val}">
        <span class="opt-ico">${o.ico}</span>
        <span class="opt-txt">${o.txt}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <p class="wcard-step">Paso ${stepIdx + 1} de ${STEPS.length} · ${s.lbl}</p>
      <h2 class="wcard-title">${s.title}</h2>
      <p class="wcard-desc">${s.desc}</p>
      <div class="opts-grid">${optsHTML}</div>
      <div class="swipe-hint ${answers[stepIdx] ? 'show' : ''}">
        <span class="hint-arr">↑</span>
        <span>Deslizá para continuar</span>
      </div>
    `;

    // Option tap
    card.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        answers[stepIdx] = el.dataset.val;
        card.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
        el.classList.add('sel');
        const hint = card.querySelector('.swipe-hint');
        if (hint) hint.classList.add('show');
      });
    });
  }

  cardZone.appendChild(card);
  setupSwipe(card, stepIdx);
}

// ── SETUP SWIPE ─────────────────────────────────────────
function setupSwipe(card, stepIdx) {
  let startY = 0, startT = 0;

  card.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startT = Date.now();
  }, { passive: true });

  card.addEventListener('touchend', e => {
    if (stepIdx !== cur || busy) return;
    const dy = startY - e.changedTouches[0].clientY;
    const dt = Date.now() - startT;
    const vel = Math.abs(dy) / dt;

    if (Math.abs(dy) < 28) return;

    if (dy > 0 && vel > 0.18) tryAdvance();
    else if (dy < 0 && vel > 0.18 && cur > 0) goBack();
  }, { passive: true });
}

// ── ADVANCE ─────────────────────────────────────────────
function tryAdvance() {
  const s = STEPS[cur];
  if (s.isResult) return;

  if (s.validate && !s.validate()) {
    const card = cardZone.querySelector('.wcard');
    if (card) {
      card.classList.remove('anim-shake');
      void card.offsetWidth;
      card.classList.add('anim-shake');
      card.addEventListener('animationend', () => card.classList.remove('anim-shake'), { once: true });
    }
    showToast('Elegí una opción para continuar ↑');
    return;
  }

  busy = true;
  const oldCard = cardZone.querySelector('.wcard');
  if (oldCard) {
    oldCard.classList.add('anim-exit');
    oldCard.addEventListener('animationend', () => oldCard.remove(), { once: true });
  }

  addChip(cur);
  cur++;

  setTimeout(() => {
    renderCard(cur, true);
    busy = false;
  }, 140);
}

// ── GO BACK ──────────────────────────────────────────────
function goBack() {
  if (cur === 0) return;
  editStep(cur - 1);
}

// ── EDIT STEP (tap chip) ─────────────────────────────────
function editStep(stepIdx) {
  busy = true;
  // Clear answers from stepIdx onward
  for (let i = stepIdx; i < STEPS.length; i++) delete answers[i];
  // Remove chips from stepIdx onward
  [...chipsZone.querySelectorAll('.step-chip')].forEach(c => {
    if (+c.dataset.step >= stepIdx) c.remove();
  });
  // Remove current card
  while (cardZone.firstChild) cardZone.removeChild(cardZone.firstChild);
  cur = stepIdx;
  renderCard(cur, true);
  setTimeout(() => { busy = false; }, 300);
}

// ── INIT ────────────────────────────────────────────────
renderCard(0, false);
</script>
</body>
</html>
