<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SERVY — Buscar V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:    #3CE6C5;
    --ink:       #F2EEE6;
    --ink-mute:  rgba(242,238,230,0.55);
    --bg:        #0E0F12;
    --bg-card:   #1C1E23;
    --bg-back:   #17191E;
    --line:      rgba(242,238,230,0.08);
    --f-display:'Bricolage Grotesque', sans-serif;
    --f-sans:   'Geist', sans-serif;
    --spring:    cubic-bezier(0.32, 0.72, 0, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-sans);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 24px;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    margin-bottom: 16px;
  }
  .topbar-logo {
    font-family: var(--f-display);
    font-size: 20px; font-weight: 800;
    color: var(--accent);
  }
  .topbar-step {
    margin-left: auto;
    font-size: 12px; color: var(--ink-mute);
  }

  /* ── CHIPS ZONE ──
     Chips solapan como un mazo de cartas: sin gap, con margin-top negativo por JS.
     La carta activa también solapa el último chip (margin-top: -16px via JS).
  */
  .chips-zone {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    /* sin gap — el solapamiento lo maneja JS */
  }

  .step-chip {
    background: var(--bg-back);
    border: 1px solid rgba(60,230,197,0.18);
    border-radius: 20px;
    padding: 11px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    position: relative;
    /* Entrada: sube desde abajo y solapa la carta anterior */
    opacity: 0;
    transform: translateY(16px) scale(0.96);
    transition: opacity 0.38s var(--spring), transform 0.38s var(--spring);
  }
  .step-chip.in {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .step-chip:active { opacity: 0.7; }

  .chip-ico  { font-size: 18px; flex-shrink: 0; }
  .chip-body { flex: 1; min-width: 0; }
  .chip-val  { font-size: 13px; font-weight: 600; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-lbl  { font-size: 10px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 1px; }
  .chip-edit { font-size: 13px; color: rgba(242,238,230,0.22); flex-shrink: 0; }

  /* ── CARD ZONE ──
     Flex: 1. La carta activa NO ocupa toda la altura:
     deja 52px al fondo para que asoma la siguiente (peek strip).
     margin-top: 0 al inicio; se cambia a -16px cuando hay chips (solapa el último chip).
  */
  .card-zone {
    flex: 1;
    position: relative;
    min-height: 0;
    z-index: 5;
    /* Transición suave cuando aparece el primer chip */
    transition: margin-top 0.40s var(--spring);
  }

  /* ── CARTA ACTIVA ── */
  .wcard {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: 52px;          /* espacio para el peek abajo */
    background: var(--bg-card);
    border: 1px solid rgba(242,238,230,0.10);
    border-radius: 26px;
    padding: 24px 22px 18px;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 10px 48px rgba(0,0,0,0.55),
      0 1px 0 rgba(242,238,230,0.06) inset;
    z-index: 2;
    overflow: hidden;
  }
  .wcard.fwd  { animation: enter-fwd  0.54s var(--spring) forwards; }
  .wcard.back { animation: enter-back 0.48s var(--spring) forwards; }
  .wcard.exit { animation: card-exit  0.26s ease-in      forwards; pointer-events: none; }
  .wcard.shake { animation: card-shake 0.42s cubic-bezier(0.36,.07,.19,.97) both; }

  @keyframes enter-fwd {
    from { transform: translateY(68px) scale(0.95); opacity: 0; }
    to   { transform: translateY(0)    scale(1);    opacity: 1; }
  }
  @keyframes enter-back {
    from { transform: translateY(-52px) scale(0.95); opacity: 0; }
    to   { transform: translateY(0)     scale(1);    opacity: 1; }
  }
  @keyframes card-exit {
    from { transform: translateY(0)    scale(1);    opacity: 1; }
    to   { transform: translateY(-52px) scale(0.92); opacity: 0; }
  }
  @keyframes card-shake {
    0%,100% { transform: translateX(0);  }
    18% { transform: translateX(-10px); }
    36% { transform: translateX(9px);  }
    54% { transform: translateX(-6px); }
    72% { transform: translateX(5px);  }
  }

  /* ── PEEK STRIP (siguiente paso visible debajo de la carta activa) ── */
  .peek-strip {
    position: absolute;
    bottom: 0; left: 6px; right: 6px;
    height: 64px;
    background: var(--bg-back);
    border: 1px solid rgba(242,238,230,0.06);
    border-radius: 22px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    z-index: 0;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.40s ease, transform 0.40s var(--spring);
    pointer-events: none;
  }
  .peek-strip.show {
    opacity: 1;
    transform: translateY(0);
  }
  .peek-ico { font-size: 15px; color: var(--ink-mute); }
  .peek-txt { flex: 1; }
  .peek-lbl { font-size: 13px; font-weight: 500; color: rgba(242,238,230,0.45); }
  .peek-num { font-size: 10px; color: rgba(242,238,230,0.25); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 1px; }
  .peek-arr { font-size: 13px; color: rgba(242,238,230,0.22); animation: pulse-up 1.8s ease-in-out infinite; }
  @keyframes pulse-up {
    0%,100% { transform: translateY(0); opacity: 0.22; }
    50%      { transform: translateY(-4px); opacity: 0.50; }
  }

  /* ── CONTENIDO CARTA ── */
  .wcard-step {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px; flex-shrink: 0;
  }
  .wcard-title {
    font-family: var(--f-display);
    font-size: 25px; font-weight: 800; line-height: 1.15;
    margin-bottom: 6px; flex-shrink: 0;
  }
  .wcard-desc {
    font-size: 13px; line-height: 1.6;
    color: var(--ink-mute); margin-bottom: 18px; flex-shrink: 0;
  }

  /* ── OPCIONES ── */
  .opts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    flex: 1;
    align-content: start;
  }
  .opt {
    background: rgba(242,238,230,0.04);
    border: 1.5px solid rgba(242,238,230,0.08);
    border-radius: 16px;
    padding: 16px 12px;
    display: flex; flex-direction: column; gap: 7px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.10s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt:active  { transform: scale(0.94); }
  .opt.sel     { background: rgba(60,230,197,0.10); border-color: rgba(60,230,197,0.46); }
  .opt-ico     { font-size: 22px; }
  .opt-txt     { font-size: 13px; font-weight: 500; }
  .opt.sel .opt-txt { color: var(--accent); }

  /* ── HINT DESLIZAR (dentro de la carta) ── */
  .swipe-hint {
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    margin-top: auto; padding-top: 12px;
    flex-shrink: 0;
    color: var(--ink-mute);
    opacity: 0; transition: opacity 0.30s ease; pointer-events: none;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .swipe-hint.show { opacity: 0.60; }
  .hint-arr { font-size: 12px; }

  /* ── RESULTADOS ── */
  .results-list {
    display: flex; flex-direction: column; gap: 10px;
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    margin-bottom: 14px;
  }
  .ri {
    display: flex; align-items: center; gap: 12px;
    background: rgba(242,238,230,0.04);
    border: 1px solid var(--line);
    border-radius: 15px; padding: 13px 15px;
  }
  .ri-av {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .ri-info { flex: 1; }
  .ri-name { font-size: 14px; font-weight: 600; }
  .ri-meta { font-size: 11px; color: var(--ink-mute); margin-top: 2px; }
  .ri-badge {
    font-size: 10px; font-weight: 600;
    padding: 3px 8px; border-radius: 99px;
    background: rgba(60,230,197,0.15); color: var(--accent); white-space: nowrap;
  }
  .btn-cta {
    width: 100%; padding: 15px; border-radius: 999px; border: none;
    background: var(--accent); color: #0a0a0a;
    font-family: var(--f-sans); font-size: 15px; font-weight: 700;
    cursor: pointer; flex-shrink: 0;
    transition: transform 0.12s;
  }
  .btn-cta:active { transform: scale(0.97); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: rgba(24,26,31,0.96);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(242,238,230,0.12);
    border-radius: 999px; padding: 10px 20px;
    font-size: 13px; color: var(--ink);
    opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none; white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .wcard, .step-chip, .peek-strip, .peek-arr { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="topbar">
    <span class="topbar-logo">SERVY</span>
    <span class="topbar-step" id="topStep">Paso 1 de 3</span>
  </header>

  <!-- Chips de steps completados (se solapan como mazo de cartas) -->
  <div class="chips-zone" id="chipsZone"></div>

  <!-- Carta activa + peek de la siguiente -->
  <div class="card-zone" id="cardZone">
    <!-- .wcard se inyecta acá via JS, antes del peek -->
    <div class="peek-strip" id="peekStrip">
      <span class="peek-ico">◻</span>
      <div class="peek-txt">
        <p class="peek-lbl" id="peekLbl">Zona</p>
        <p class="peek-num" id="peekNum">Paso 2 de 3</p>
      </div>
      <span class="peek-arr">↑</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATOS ─────────────────────────────────────────────
const STEPS = [
  {
    lbl: 'Problema',
    title: '¿Qué necesitás arreglar?',
    desc: 'Elegí el tipo de trabajo.',
    opts: [
      { ico:'🔧', txt:'Plomería',      val:'plomeria' },
      { ico:'⚡', txt:'Electricidad',  val:'electricidad' },
      { ico:'🔥', txt:'Gas',           val:'gas' },
      { ico:'🏠', txt:'Albañilería',   val:'albanileria' },
    ],
    validate: () => !!answers[0],
    summary:  () => STEPS[0].opts.find(x => x.val === answers[0]) || null,
  },
  {
    lbl: 'Zona',
    title: '¿En qué barrio estás?',
    desc: 'Buscamos prestadores cerca tuyo.',
    opts: [
      { ico:'📍', txt:'Villa Allende',    val:'villa-allende' },
      { ico:'📍', txt:'Córdoba Capital',  val:'cordoba' },
      { ico:'📍', txt:'La Calera',        val:'la-calera' },
      { ico:'📍', txt:'Otro barrio',      val:'otro' },
    ],
    validate: () => !!answers[1],
    summary:  () => STEPS[1].opts.find(x => x.val === answers[1]) || null,
  },
  { lbl: 'Resultados', isResult: true },
];

const answers = {};
let cur   = 0;
let busy  = false;
let toastT = null;

const chipsZone = document.getElementById('chipsZone');
const cardZone  = document.getElementById('cardZone');
const topStep   = document.getElementById('topStep');
const toastEl   = document.getElementById('toast');
const peekStrip = document.getElementById('peekStrip');
const peekLbl   = document.getElementById('peekLbl');
const peekNum   = document.getElementById('peekNum');

// ── TOAST ──────────────────────────────────────────────
function showToast(msg) {
  clearTimeout(toastT);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

// ── PEEK STRIP ─────────────────────────────────────────
function updatePeek(stepIdx) {
  const next = STEPS[stepIdx + 1];
  if (!next) { peekStrip.classList.remove('show'); return; }
  peekLbl.textContent = next.lbl;
  peekNum.textContent = `Paso ${stepIdx + 2} de ${STEPS.length}`;
  peekStrip.classList.add('show');
}

// ── AGREGAR CHIP (step completado) ─────────────────────
function addChip(stepIdx) {
  const s    = STEPS[stepIdx];
  const info = s.summary && s.summary();
  if (!info) return;

  const isFirst = chipsZone.children.length === 0;
  const chip    = document.createElement('div');
  chip.className    = 'step-chip';
  chip.dataset.step = stepIdx;

  // Cada chip nuevo va ENCIMA del anterior (mayor z-index, solapa desde abajo)
  const depth = chipsZone.children.length;
  chip.style.zIndex = depth + 1;
  if (!isFirst) chip.style.marginTop = '-14px'; // solapamiento

  chip.innerHTML = `
    <span class="chip-ico">${info.ico}</span>
    <div class="chip-body">
      <p class="chip-val">${info.txt}</p>
      <span class="chip-lbl">${s.lbl}</span>
    </div>
    <span class="chip-edit">✎</span>
  `;
  chip.addEventListener('click', () => { if (!busy) editStep(stepIdx); });
  chipsZone.appendChild(chip);

  // La zona de carta solapa el stack de chips
  if (isFirst) cardZone.style.marginTop = '-16px';

  // Animación de entrada (doble rAF para que la transición CSS dispare)
  requestAnimationFrame(() => requestAnimationFrame(() => chip.classList.add('in')));
}

// ── RENDERIZAR CARTA ───────────────────────────────────
function renderCard(stepIdx, dir /* 'none'|'fwd'|'back' */) {
  const s = STEPS[stepIdx];
  topStep.textContent = `Paso ${stepIdx + 1} de ${STEPS.length}`;
  updatePeek(stepIdx);

  const card = document.createElement('div');
  card.className = 'wcard' + (dir !== 'none' ? ' ' + dir : '');
  card.addEventListener('animationend', () => {
    card.classList.remove('fwd', 'back');
  }, { once: true });

  if (s.isResult) {
    card.innerHTML = `
      <p class="wcard-step">Paso ${stepIdx + 1} de ${STEPS.length} · ${s.lbl}</p>
      <h2 class="wcard-title">3 prestadores<br>cerca tuyo</h2>
      <div class="results-list">
        <div class="ri">
          <div class="ri-av" style="background:rgba(60,230,197,0.15)">🔧</div>
          <div class="ri-info">
            <p class="ri-name">Martín Hlavach</p>
            <p class="ri-meta">⭐ 4.9 · Plomero · 47 trabajos</p>
          </div>
          <span class="ri-badge">Verificado</span>
        </div>
        <div class="ri">
          <div class="ri-av" style="background:rgba(198,255,60,0.12)">⚡</div>
          <div class="ri-info">
            <p class="ri-name">José Rodríguez</p>
            <p class="ri-meta">⭐ 4.7 · Electricista · 31 trabajos</p>
          </div>
          <span class="ri-badge">Recomendado</span>
        </div>
        <div class="ri">
          <div class="ri-av" style="background:rgba(245,183,49,0.12)">🔥</div>
          <div class="ri-info">
            <p class="ri-name">Carlos Pérez</p>
            <p class="ri-meta">⭐ 4.6 · Gasista · 22 trabajos</p>
          </div>
          <span class="ri-badge" style="background:rgba(245,183,49,0.15);color:#F5B731">Destacado</span>
        </div>
      </div>
      <button class="btn-cta" id="ctaBtn">Ver resultados →</button>
    `;
    card.querySelector('#ctaBtn').addEventListener('click', () =>
      showToast('¡Conectando con los prestadores!')
    );
  } else {
    const optsHTML = s.opts.map(o => `
      <div class="opt ${answers[stepIdx] === o.val ? 'sel' : ''}" data-val="${o.val}">
        <span class="opt-ico">${o.ico}</span>
        <span class="opt-txt">${o.txt}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <p class="wcard-step">Paso ${stepIdx + 1} de ${STEPS.length} · ${s.lbl}</p>
      <h2 class="wcard-title">${s.title}</h2>
      <p class="wcard-desc">${s.desc}</p>
      <div class="opts-grid">${optsHTML}</div>
      <div class="swipe-hint ${answers[stepIdx] ? 'show' : ''}">
        <span class="hint-arr">↑</span>
        <span>Deslizá para continuar</span>
      </div>
    `;
    card.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        answers[stepIdx] = el.dataset.val;
        card.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
        el.classList.add('sel');
        card.querySelector('.swipe-hint')?.classList.add('show');
      });
    });
  }

  // Insertar ANTES del peek strip para que quede en el orden correcto
  cardZone.insertBefore(card, peekStrip);
  setupSwipe(card, stepIdx);
}

// ── DETECCIÓN DE SWIPE ─────────────────────────────────
function setupSwipe(card, stepIdx) {
  let sy = 0, st = 0;

  card.addEventListener('touchstart', e => {
    sy = e.touches[0].clientY;
    st = Date.now();
  }, { passive: true });

  card.addEventListener('touchend', e => {
    if (stepIdx !== cur || busy) return;
    const dy  = sy - e.changedTouches[0].clientY;
    const vel = Math.abs(dy) / (Date.now() - st);
    if (Math.abs(dy) < 26) return;
    if      (dy > 0 && vel > 0.18)              tryAdvance();
    else if (dy < 0 && vel > 0.18 && cur > 0)  goBack();
  }, { passive: true });
}

// ── AVANZAR ────────────────────────────────────────────
function tryAdvance() {
  const s = STEPS[cur];
  if (s.isResult) return;

  if (s.validate && !s.validate()) {
    const card = cardZone.querySelector('.wcard');
    if (card) {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
    }
    showToast('Elegí una opción para continuar ↑');
    return;
  }

  busy = true;
  const old = cardZone.querySelector('.wcard');
  if (old) {
    old.classList.add('exit');
    old.addEventListener('animationend', () => old.remove(), { once: true });
  }
  addChip(cur);
  cur++;
  setTimeout(() => { renderCard(cur, 'fwd'); busy = false; }, 130);
}

// ── VOLVER ─────────────────────────────────────────────
function goBack() {
  if (cur === 0) return;
  editStep(cur - 1);
}

// ── EDITAR (tap en chip) ───────────────────────────────
function editStep(stepIdx) {
  busy = true;
  for (let i = stepIdx; i < STEPS.length; i++) delete answers[i];

  // Quitar chips de este step en adelante
  [...chipsZone.querySelectorAll('.step-chip')].forEach(c => {
    if (+c.dataset.step >= stepIdx) c.remove();
  });

  // Ajustar margin según chips restantes
  cardZone.style.marginTop = chipsZone.children.length > 0 ? '-16px' : '0';

  // Quitar carta activa
  const old = cardZone.querySelector('.wcard');
  if (old) old.remove();

  cur = stepIdx;
  renderCard(cur, 'back');
  setTimeout(() => { busy = false; }, 300);
}

// ── INICIO ─────────────────────────────────────────────
renderCard(0, 'none');
</script>
</body>
</html>
