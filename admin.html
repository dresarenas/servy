<html lang="es">
<head>
<meta charset="UTF-8">

<style>
:root{
  --accent:#00C9A7; --accent-hover:#00E4BD; --accent-2:#B8E986;
  --ink:#E8EFF8; --ink-dim:rgba(232,239,248,0.55);
  --bg:#0B1A2B; --bg-elev:rgba(15,34,55,0.75);
  --line:rgba(255,255,255,0.08);
  --f-display:'Space Grotesk',sans-serif; --f-sans:'Plus Jakarta Sans',sans-serif;
  --bad:#FF6B7A; --warn:#FFC66B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);min-height:100vh;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}

/* ---- Login ---- */
#loginView{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--bg-elev);border:1px solid var(--line);border-radius:20px;padding:32px}
.login-card h1{font-family:var(--f-display);font-size:1.5rem;margin-bottom:4px}
.login-card p{color:var(--ink-dim);font-size:.85rem;margin-bottom:22px}
.login-card label{display:block;font-size:.78rem;color:var(--ink-dim);margin:14px 0 6px}
.login-card input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-family:var(--f-sans);font-size:.95rem}
.login-card input:focus{outline:none;border-color:var(--accent)}
#loginBtn{width:100%;margin-top:22px;background:var(--accent);color:#04241C;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:var(--f-sans)}
#loginBtn:hover{background:var(--accent-hover)}
#loginBtn:disabled{opacity:.5;cursor:wait}
#loginErr{color:var(--bad);font-size:.82rem;margin-top:12px;display:none}

/* ---- App shell ---- */
#appView{display:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(11,26,43,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.topbar .brand span{color:var(--accent)}
.topbar .spacer{flex:1}
.topbar button{background:rgba(255,255,255,0.06);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:.8rem;cursor:pointer;font-family:var(--f-sans)}
.topbar button:hover{border-color:var(--accent);color:var(--accent)}
#lastUpd{color:var(--ink-dim);font-size:.72rem}

.tabs{display:flex;gap:6px;padding:12px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab-btn{flex-shrink:0;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-dim);padding:10px 14px;font-size:.86rem;font-weight:600;cursor:pointer;font-family:var(--f-sans);white-space:nowrap}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--ink)}

main{padding:20px;max-width:1100px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;padding:16px}
.card .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.1}
.card .v small{font-size:.9rem;color:var(--ink-dim);font-weight:500}
.card .k{color:var(--ink-dim);font-size:.75rem;margin-top:4px}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--accent)}

.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:820px){.panel-grid{grid-template-columns:1fr}}
.box{background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;padding:18px}
.box h3{font-family:var(--f-display);font-size:.95rem;margin-bottom:12px}
.box .chart-wrap{position:relative;height:220px}

table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;color:var(--ink-dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:600;background:rgba(0,201,167,0.12);color:var(--accent)}
.pill.warn{background:rgba(255,198,107,0.12);color:var(--warn)}
.pill.bad{background:rgba(255,107,122,0.12);color:var(--bad)}
.muted{color:var(--ink-dim)}
.empty{color:var(--ink-dim);font-size:.85rem;padding:18px 4px;text-align:center}

.links-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.links-row a{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.76rem;color:var(--ink)}
.links-row a:hover{border-color:var(--accent);color:var(--accent)}
.links-row a .tag{font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(0,201,167,0.15);color:var(--accent)}
.links-row a .tag.n8n{background:rgba(255,107,122,0.14);color:#ff8c9a}
.links-row a .tag.ext{background:rgba(184,233,134,0.14);color:var(--accent-2)}
.links-row a.off{opacity:.5}

.rank{list-style:none}
.rank li{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.84rem}
.rank li:last-child{border-bottom:none}
.rank li b{font-family:var(--f-display)}

.note{background:rgba(255,198,107,0.07);border:1px solid rgba(255,198,107,0.25);border-radius:12px;padding:12px 14px;font-size:.8rem;color:var(--ink-dim);margin-bottom:20px}
.note b{color:var(--warn)}

/* Form redes */
.social-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.social-form label{display:block;font-size:.7rem;color:var(--ink-dim);margin-bottom:4px}
.social-form input,.social-form select{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);font-family:var(--f-sans);font-size:.85rem}
.social-form input:focus,.social-form select:focus{outline:none;border-color:var(--accent)}
.social-form button{background:var(--accent);color:#04241C;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-family:var(--f-sans);font-size:.85rem}
#socialMsg{font-size:.78rem;margin-top:8px}
</style>
</head>

/* ================= AUTH ================= */
function getSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }
function setSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

async function authFetch(path, body){
  const res = await fetch(SB + path, {
    method:'POST',
    headers:{ 'apikey':ANON, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  const d = await res.json().catch(()=>({}));
  return { ok: res.ok, d };
}

async function login(email, pass){
  const r = await authFetch('/auth/v1/token?grant_type=password', { email, password: pass });
  if(!r.ok) throw new Error(r.d.error_description || r.d.msg || 'Login inválido');
  setSession({ at:r.d.access_token, rt:r.d.refresh_token, exp: Date.now() + (r.d.expires_in||3600)*1000, email });
}

async function freshToken(){
  let s = getSession();
  if(!s) return null;
  if(Date.now() > s.exp - 60000){
    const r = await authFetch('/auth/v1/token?grant_type=refresh_token', { refresh_token: s.rt });
    if(!r.ok){ clearSession(); return null; }
    s = { at:r.d.access_token, rt:r.d.refresh_token, exp: Date.now() + (r.d.expires_in||3600)*1000, email:s.email };
    setSession(s);
  }
  return s.at;
}

async function rpc(name, args){
  const tk = await freshToken();
  if(!tk){ showLogin(); throw new Error('sin sesión'); }
  const res = await fetch(SB + '/rest/v1/rpc/' + name, {
    method:'POST',
    headers:{ 'apikey':ANON, 'Authorization':'Bearer '+tk, 'Content-Type':'application/json' },
    body: JSON.stringify(args||{})
  });
  if(res.status===401 || res.status===403){ clearSession(); showLogin(); throw new Error('sesión vencida o sin permisos'); }
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.message||('Error '+res.status)); }
  return res.json();
}

async function replayCall(body){
  const tk = await freshToken();
  if(!tk){ showLogin(); throw new Error('sin sesión'); }
  const res = await fetch(SB + '/functions/v1/wa-bot-replay', {
    method:'POST',
    headers:{ 'apikey':ANON, 'Authorization':'Bearer '+tk, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(res.status===401 || res.status===403){ clearSession(); showLogin(); throw new Error('sesión vencida o sin permisos'); }
  const d = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(d.error||d.message||('Error '+res.status));
  return d;
}

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const nf = n => (n==null?'—':Number(n).toLocaleString('es-AR'));
function fdt(x){ if(!x) return '—'; const d=new Date(x); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
function fd(x){ if(!x) return '—'; return new Date(x+'T00:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
function esc(x){ const d=document.createElement('div'); d.textContent = x==null?'':String(x); return d.innerHTML; }
function pill(estado){
  const bad = ['rechazo_1','rechazo_2','opt_out','sin_estado','inactivo'];
  const warn = ['nueva','contactar','contactado','no_respondio','nuevo','pendiente'];
  const cls = bad.includes(estado)?'bad':(warn.includes(estado)?'warn':'');
  return '<span class="pill '+cls+'">'+esc(estado)+'</span>';
}
function linksRow(mod){
  const m = MODULES[mod]; let h = '<div class="links-row">';
  m.tables.forEach(t=>{ h += '<a href="'+SUPA_ED+t.oid+'" target="_blank" rel="noopener"><span class="tag">DB</span>'+esc(t.n)+'</a>'; });
  m.wfs.forEach(w=>{ h += '<a class="'+(w.off?'off':'')+'" href="'+N8N_URL+w.id+'" target="_blank" rel="noopener"><span class="tag n8n">n8n</span>'+esc(w.n)+(w.off?' (inactivo)':'')+'</a>'; });
  m.ext.forEach(x=>{ h += '<a href="'+x.url+'" target="_blank" rel="noopener"><span class="tag ext">↗</span>'+esc(x.n)+'</a>'; });
  return h + '</div>';
}
const charts = {};
function mkChart(id, cfg){
  if(charts[id]) charts[id].destroy();
  const el = document.getElementById(id);
  if(!el) return;
  Chart.defaults.color = 'rgba(232,239,248,0.55)';
  Chart.defaults.borderColor = 'rgba(255,255,255,0.08)';
  Chart.defaults.font.family = "'Plus Jakarta Sans',sans-serif";
  charts[id] = new Chart(el, cfg);
}
function rankList(arr){
  if(!arr || !arr.length) return '<div class="empty">Sin datos todavía</div>';
  return '<ul class="rank">'+arr.map(x=>'<li><span>'+esc(x.k)+'</span><b>'+nf(x.n)+'</b></li>').join('')+'</ul>';
}
function objToRank(obj){ return Object.entries(obj||{}).map(([k,n])=>({k,n})).sort((a,b)=>b.n-a.n); }

/* ================= SHELL ================= */
const TABS = [ ['resumen','Resumen'], ['busquedas','Búsquedas'], ['propuestas','Propuestas'], ['prestadores','Prestadores'], ['bot','Bot WA'], ['correcciones','Correcciones'], ['visitas','Visitas'], ['redes','Redes'] ];
const loadedEvents = {};

function buildShell(){
  $('#tabsBar').innerHTML = TABS.map(([id,lb])=>'<button class="tab-btn" data-tab="'+id+'">'+lb+'</button>').join('');
  $('#mainContent').innerHTML = TABS.map(([id])=>'<section class="tab-panel" id="tab-'+id+'"></section>').join('');
  document.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=> openTab(b.dataset.tab)) );
}
function openTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.tab-panel').forEach(p=> p.classList.toggle('active', p.id==='tab-'+id));
  if(id==='correcciones') renderCorrecciones();
  if(!loadedEvents[id]) loadEvents(id);
}

/* ================= RENDER ================= */
let STATS = null;

function renderAll(){
  const s = STATS;
  renderResumen(s);
  renderBusquedas(s);
  renderPropuestas(s);
  renderPrestadores(s);
  renderBot(s);
  renderVisitas(s);
  renderRedes(s);
  $('#lastUpd').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
}

function card(v, k, tab, sub){
  return '<div class="card '+(tab?'click':'')+'" '+(tab?'data-go="'+tab+'"':'')+'><div class="v">'+v+(sub?' <small>'+sub+'</small>':'')+'</div><div class="k">'+k+'</div></div>';
}

function renderResumen(s){
  const ig = s.redes.ultimo_ig;
  const vDias = s.visitas.dias;
  const ult = vDias.length ? vDias[vDias.length-1] : null;
  $('#tab-resumen').innerHTML =
    '<div class="cards">'
    + card(nf(s.prestadores.activos), 'Prestadores activos', 'prestadores', '/ '+nf(s.prestadores.total))
    + card(nf((s.propuestas.por_estado||{}).nueva||0), 'Propuestas nuevas', 'propuestas', '/ '+nf(s.propuestas.total))
    + card(nf(s.busquedas.hoy), 'Búsquedas hoy', 'busquedas', '· sem '+nf(s.busquedas.semana))
    + card(nf(s.bot.conversaciones), 'Conversaciones bot', 'bot', '· '+nf(s.bot.msgs_hoy)+' msgs hoy')
    + card(nf(s.bot.opt_outs), 'Opt-outs', 'bot')
    + card(ult?nf(ult.usuarios):'—', 'Visitas (último día)', 'visitas')
    + card(ig?nf(ig.seguidores):'—', 'Seguidores IG', 'redes')
    + '</div>'
    + renderEstadoServicios(s.monitor, s.bot)
    + '<div class="note"><b>Regla del tablero:</b> cada cambio en módulos, tablas o workflows de SERVY se refleja acá (config MODULES + RPC admin_dashboard_stats).</div>';
  document.querySelectorAll('#tab-resumen .card.click').forEach(c=> c.addEventListener('click', ()=> openTab(c.dataset.go)) );
  const btnChk = $('#btnCheckMonitor');
  if(btnChk) btnChk.addEventListener('click', chequearMonitorAhora);
}

function renderEstadoServicios(mon, bot){
  if(!mon) return '<div class="box"><h3>Estado de servicios</h3><div class="empty">Todavía no corrió el Monitor de Créditos.</div></div>';
  const pill2 = ok => '<span class="pill '+(ok?'':'bad')+'" style="margin-left:6px">'+(ok?'✓ OK':'✗ falla')+'</span>';
  // Chequeo de COMPORTAMIENTO, no de conectividad (31/07): cuenta conversaciones
  // que ya deberían haber recibido el recordatorio de silencio (mismo criterio
  // que la RPC del workflow, +15min de margen) y no lo tienen. Bug real: el
  // workflow corría perfecto cada 30 min pero RLS sin policy + key anon hacía
  // que siempre encontrara 0 filas -- un pill de "Supabase ✓" nunca detecta
  // eso, porque Supabase SÍ estaba respondiendo bien.
  const vencidos = bot ? Number(bot.recordatorio_vencidos || 0) : null;
  const recordatorioOk = vencidos === 0;
  return '<div class="box"><h3>Estado de servicios</h3>'
    + '<div class="cards">'

async function loadPropuestasAdmin(){
  const holder = document.getElementById('propAdminList');

      h += '<tr><td>'+(r.revisar?'<span title="Rubro fuera de catálogo o calificación baja — revisar antes de contactar">⚠️ </span>':'')+esc(r.nombre||'—')+'</td><td>'+esc(r.rubro||'—')+'</td><td>'+esc(r.zona||'—')+'</td><td class="muted">'+esc(r.recomendado_por||'—')+'</td>'

    });
    holder.innerHTML = h + '</tbody></table></div>';
    holder.querySelectorAll('.prop-btn').forEach(b=> b.addEventListener('click', async ()=>{
      b.disabled = true; b.textContent = '…';

async function ejecutarConsentimiento(){
  const btn = document.getElementById('btnEjecConsent');
  if(!confirm('Esto envía el WhatsApp de consentimiento a TODAS las propuestas en estado "contactar". ¿Ejecutar ahora?')) return;
  btn.disabled = true; btn.textContent = 'Ejecutando…';
  try{
    const res = await fetch(WEBHOOK_CONSENT, { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    btn.textContent = '✓ Lanzado — actualizando…';
    setTimeout(()=>{ loadPropuestasAdmin(); btn.disabled=false; btn.textContent='📤 Ejecutar consentimiento (contacta las marcadas)'; }, 15000);
  }catch(e){
    alert('Error al ejecutar: '+e.message);
    btn.disabled=false; btn.textContent='📤 Ejecutar consentimiento (contacta las marcadas)';
  }
}

const EV_DEFS = {
  busquedas: { rpcMod:'busquedas', cols:[['oficio','Oficio'],['zona','Zona'],['resultados_count','Result.'],['canal','Canal'],['created_at','Cuándo','dt']] },
  propuestas: { rpcMod:'propuestas', cols:[['nombre_propuesto','Nombre'],['categoria_sugerida','Rubro'],['zona_recomendante','Zona recom.'],['estado','Estado','pill'],['source','Origen'],['created_at','Cuándo','dt']] },
  prestadores: { rpcMod:'prestadores', cols:[['nombre','Nombre'],['estado','Estado','pill'],['slug','Slug'],['con_panel','Panel','bool'],['created_at','Alta','dt']] },
  bot: { rpcMod:'bot', cols:[['telefono','Teléfono'],['mensaje','Mensaje'],['respuesta_bot','Respuesta'],['flujo','Flujo'],['created_at','Cuándo','dt']] },
  redes: { rpcMod:'redes', cols:[['fecha','Fecha','d'],['red','Red'],['seguidores','Seguidores'],['alcance','Alcance'],['interacciones','Interac.'],['fuente','Fuente']] }
};

async function loadEvents(tab){
  const def = EV_DEFS[tab];
  if(!def) { loadedEvents[tab]=true; return; }
  const holder = document.getElementById('ev-'+tab);
  if(!holder) return;
  try{
    const rows = await rpc('admin_ultimos_eventos', { p_modulo: def.rpcMod, p_limite: 15 });
    loadedEvents[tab] = true;
    if(!rows || !rows.length){ holder.innerHTML = '<div class="empty">Sin registros todavía</div>'; return; }
    let h = '<div style="overflow-x:auto"><table><thead><tr>'+def.cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>';
    rows.forEach(r=>{
      h += '<tr>'+def.cols.map(c=>{
        const v = r[c[0]];
        if(c[2]==='dt') return '<td class="muted">'+fdt(v)+'</td>';
        if(c[2]==='d') return '<td class="muted">'+fd(v)+'</td>';
        if(c[2]==='pill') return '<td>'+pill(v||'—')+'</td>';
        if(c[2]==='bool') return '<td>'+(v?'✓':'—')+'</td>';
        return '<td>'+esc(v==null?'—':v)+'</td>';
      }).join('')+'</tr>';
    });
    holder.innerHTML = h + '</tbody></table></div>';
  }catch(e){ holder.innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>'; }
}

/* ================= CORRECCIONES (agente aprendiz) ================= */
let correccionesTurnos = [];
let correccionesYaHechas = new Set();
let correccionesBugYaHechas = new Set();

async function renderCorrecciones(){
  const el = $('#tab-correcciones');
  el.innerHTML =
    '<div class="note"><b>Agente aprendiz:</b> cargá los turnos reales de un teléfono, recalculá con el código de hoy, '
    + 'y aprobá / editá / reescribí la respuesta. La corrección queda guardada como memoria para futuras respuestas del bot en el mismo estado.</div>'
    + '<div class="box" style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    + '<input id="corrTel" type="text" placeholder="Teléfono (ej. 5493511234567)" style="flex:1;min-width:220px;background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink)">'
    + '<button id="btnCorrCargar" style="background:var(--accent);color:#06251d;border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer">Cargar conversación</button>'
    + '</div>'
    + '<div id="corrTelefonos" style="margin-top:10px"></div>'
    + '<div id="corrLista" style="margin-top:14px"></div>';
  $('#btnCorrCargar').addEventListener('click', ()=> cargarCorreccionesTel());
  $('#corrTel').addEventListener('keydown', e=>{ if(e.key==='Enter') cargarCorreccionesTel(); });
  cargarListaTelefonos();
}

async function cargarListaTelefonos(){
  const cont = $('#corrTelefonos');
  try{
    const tels = await rpc('bot_logs_telefonos_recientes', { p_limit: 20 });
    if(!tels || !tels.length){ cont.innerHTML = ''; return; }
    cont.innerHTML = '<div class="muted" style="font-size:.8rem;margin-bottom:6px">Conversaciones recientes:</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
      + tels.map(t=>'<button class="corr-tel-chip" data-tel="'+esc(t.telefono)+'" style="background:var(--bg-elev);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:.85rem;cursor:pointer">'
        + esc(t.telefono)+' <span class="muted">('+t.turnos+' · '+fdt(t.ultima_actividad)+')</span></button>').join('')
      + '</div>';
    cont.querySelectorAll('.corr-tel-chip').forEach(b=> b.addEventListener('click', ()=>{
      $('#corrTel').value = b.dataset.tel;
      cargarCorreccionesTel();
    }));
  }catch(e){ cont.innerHTML = ''; }
}

async function cargarCorreccionesTel(){
  const tel = $('#corrTel').value.replace(/[^0-9]/g,'');
  const lista = $('#corrLista');
  if(!tel){ lista.innerHTML = '<div class="empty">Ingresá un teléfono.</div>'; return; }
  lista.innerHTML = '<div class="empty">Cargando turnos…</div>';
  try{
    const r = await replayCall({ accion:'listar', telefono: tel });
    correccionesTurnos = r.turnos || [];
    if(!correccionesTurnos.length){ lista.innerHTML = '<div class="empty">Sin turnos registrados para ese teléfono.</div>'; return; }
    try{
      const ya = await rpc('correccion_fuente_refs_existentes', { p_fuente:'bot_logs', p_fuente_refs: correccionesTurnos.map(t=>t.id) });
      correccionesYaHechas = new Set(ya||[]);
    }catch(e){ correccionesYaHechas = new Set(); }
    try{
      const yaBug = await rpc('bug_fuente_refs_existentes', { p_fuente_refs: correccionesTurnos.map(t=>t.id) });
      correccionesBugYaHechas = new Set(yaBug||[]);
    }catch(e){ correccionesBugYaHechas = new Set(); }
    const orden = correccionesTurnos.map((_,i)=>i).reverse();
    lista.innerHTML = orden.map(i=> corrTurnoBox(correccionesTurnos[i],i)).join('');
    correccionesTurnos.forEach((t,i)=>{
      const btn = $('#corrRecalc'+i);
      if(btn) btn.addEventListener('click', ()=> recalcularCorreccion(i));
    });
  }catch(e){ lista.innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>'; }
}

function corrGuardadoTxt(dec){
  const g = dec.guardado || {};
  if(g.propuesta) return '💾 Guardó propuesta: '+esc(g.propuesta.nombre||'')+' ('+esc(g.propuesta.rubro||'s/oficio')+', '+esc(g.propuesta.calificacion||'?')+'★)';
  if(g.resena) return '💾 Guardó reseña directa ('+esc(g.resena.calificacion||'?')+'★)';
  if(g.propuesta_actualizada) return '💾 Actualizó propuesta: '+esc(g.propuesta_actualizada.accion||'');
  return '';
}

// Campos con sentido de negocio dentro de contacto_pendiente -- el resto
// (intentos, sin_progreso, ultima_decision, despedido, telTipeado, etc.) es
// bookkeeping interno de la FSM, sin valor para revisar "qué tomó el bot".
const CORR_CAMPOS_DATO = [
  ['nombre','nombre'], ['tel','tel'], ['rubros','rubro'], ['calificacion','calificación'],
  ['comentario','comentario'], ['localidad','localidad'], ['horarios','horarios'],
  ['descripcion','descripción'], ['especialidades','especialidades'], ['experiencia','experiencia'], ['redes','redes'],
];
function corrDatosTxt(dec){
  const pend = dec.contacto_pendiente || {};
  const partes = [];
  if(dec.zona_nueva) partes.push('zona='+dec.zona_nueva);
  CORR_CAMPOS_DATO.forEach(([k,lbl])=>{
    if(pend[k]!=null && pend[k]!=='') partes.push(lbl+'='+(Array.isArray(pend[k])?pend[k].join('/'):pend[k]));
  });
  return partes.length ? '📋 Datos tomados: '+esc(partes.join(', ')) : '';
}

function corrTurnoBox(t, i){
  const dec = (typeof t.decision==='string' ? JSON.parse(t.decision) : t.decision) || {};
  const yaCorregido = correccionesYaHechas.has(t.id);
  const yaReportado = correccionesBugYaHechas.has(t.id);
  const audioTag = dec.tipo_mensaje==='audio' ? ' 🎤' : '';
  const guardadoTxt = corrGuardadoTxt(dec);
  const datosTxt = corrDatosTxt(dec);
  return '<div class="box" id="corrBox'+i+'" style="margin-top:10px">'
    + '<div class="muted" style="font-size:.8rem">'+fdt(t.created_at)+' · '+esc(dec.estado_origen||t.flujo||'—')+' → '+esc(dec.estado_destino||'—')
    + (yaCorregido ? ' <span class="pill" style="background:var(--accent);color:#06251d">✅ ya corregido</span>' : '')
    + (yaReportado ? ' <span id="corrBugBadge'+i+'" class="pill" style="background:#e0a030;color:#251c06">🐞 ya reportado</span>' : '<span id="corrBugBadge'+i+'"></span>')
    + '<span id="corrBadge'+i+'"></span>'
    + '</div>'
    + '<div style="margin:6px 0"><b>Usuario'+audioTag+':</b> '+esc(t.mensaje||'')+'</div>'
    + '<div style="margin:6px 0"><b>Bot (enviado):</b> '+esc(t.respuesta_bot||'')+'</div>'
    + (datosTxt ? '<div class="muted" style="font-size:.8rem;margin-bottom:2px">'+datosTxt+'</div>' : '')
    + (guardadoTxt ? '<div class="muted" style="font-size:.8rem;margin-bottom:6px">'+guardadoTxt+'</div>' : '')
    + '<button id="corrRecalc'+i+'" style="background:none;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 14px;cursor:pointer">Recalcular con código actual</button>'
    + '<div id="corrResultado'+i+'"></div>'
    + '</div>';
}

async function recalcularCorreccion(i){
  const btn = $('#corrRecalc'+i);
  const out = $('#corrResultado'+i);
  btn.disabled = true; btn.textContent = 'Recalculando…';
  try{
    const t = correccionesTurnos[i];
    const dec = (typeof t.decision==='string' ? JSON.parse(t.decision) : t.decision) || {};
    const previos = correccionesTurnos.slice(Math.max(0,i-6), i).filter(p=>p.respuesta_bot);
    const historial = previos.length ? previos.map(p=>'Usuario: '+p.mensaje+'\nBot: '+p.respuesta_bot).join('\n') : undefined;
    const ultimaRespuestaBot = previos.length ? previos[previos.length-1].respuesta_bot : undefined;
    const r = await replayCall({
      accion: 'recalcular', fuente: 'bot_logs', fuenteRef: t.id,
      conv: { estado: dec.estado_origen || 'nuevo' },
      mensaje: { tipo: 'text', texto: t.mensaje },
      historial, ultimaRespuestaBot,
    });
    out.innerHTML =
      '<div style="margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px">'
      + '<div class="muted" style="font-size:.8rem">Estado recalculado: '+esc(r.estadoNuevo)+'</div>'
      + '<div style="margin:6px 0"><b>Propuesta del bot (hoy):</b> '+esc(r.textoBot)+'</div>'
      + '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'
      + '<button class="corr-ok" style="background:var(--accent);color:#06251d;border:none;border-radius:8px;padding:7px 16px;font-weight:700;cursor:pointer">Aprobar</button>'
      + '<button class="corr-edit" style="background:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 16px;cursor:pointer">Editar</button>'
      + '<button class="corr-rewrite" style="background:none;color:var(--ink-dim);border:1px solid var(--line);border-radius:8px;padding:7px 16px;cursor:pointer">Reescribir</button>'
      + '<button class="corr-bug" style="background:none;color:#e0a030;border:1px solid #e0a030;border-radius:8px;padding:7px 16px;cursor:pointer">🐞 Reportar problema</button>'
      + '</div>'
      + '<div class="corr-editor" style="display:none;margin-top:8px">'
      + '<textarea class="corr-textarea" rows="3" style="width:100%;background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)"></textarea>'
      + '<button class="corr-guardar" style="margin-top:6px;background:var(--accent);color:#06251d;border:none;border-radius:8px;padding:7px 16px;font-weight:700;cursor:pointer">Guardar corrección</button>'
      + '</div>'
      + '<div class="corr-bug-editor" style="display:none;margin-top:8px">'
      + '<div class="muted" style="font-size:.8rem;margin-bottom:4px">Esto NO se usa como ejemplo de redacción -- va a una lista de bugs que reviso yo para arreglar el código.</div>'
      + '<textarea class="corr-bug-textarea" rows="3" placeholder="¿Qué salió mal? (ej: ya le había dado el oficio y lo volvió a preguntar)" style="width:100%;background:var(--bg-elev);border:1px solid #e0a030;border-radius:8px;padding:8px;color:var(--ink)"></textarea>'
      + '<button class="corr-bug-guardar" style="margin-top:6px;background:#e0a030;color:#251c06;border:none;border-radius:8px;padding:7px 16px;font-weight:700;cursor:pointer">Guardar reporte</button>'
      + '</div>'
      + '<div class="corr-msg muted" style="font-size:.85rem;margin-top:6px"></div>'
      + '</div>';

    const ctx = { turno: t, dec, plantillaBase: r.plantillaBase, textoBot: r.textoBot, estadoNuevo: r.estadoNuevo, router: r.router, i };
    const box = out.firstElementChild;
    const editor = box.querySelector('.corr-editor');
    const textarea = box.querySelector('.corr-textarea');
    const bugEditor = box.querySelector('.corr-bug-editor');
    const bugTextarea = box.querySelector('.corr-bug-textarea');
    const msgEl = box.querySelector('.corr-msg');

    box.querySelector('.corr-ok').addEventListener('click', ()=> guardarCorreccion(ctx, r.textoBot, false, msgEl));
    box.querySelector('.corr-edit').addEventListener('click', ()=>{ editor.style.display='block'; bugEditor.style.display='none'; textarea.value = r.textoBot; textarea.focus(); });
    box.querySelector('.corr-rewrite').addEventListener('click', ()=>{ editor.style.display='block'; bugEditor.style.display='none'; textarea.value = ''; textarea.focus(); });
    box.querySelector('.corr-bug').addEventListener('click', ()=>{ bugEditor.style.display='block'; editor.style.display='none'; bugTextarea.focus(); });
    box.querySelector('.corr-guardar').addEventListener('click', ()=>{
      const texto = textarea.value.trim();
      if(!texto){ msgEl.textContent = 'Escribí una respuesta antes de guardar.'; return; }
      guardarCorreccion(ctx, texto, true, msgEl);
    });
    box.querySelector('.corr-bug-guardar').addEventListener('click', (ev)=>{
      const nota = bugTextarea.value.trim();
      if(!nota){ msgEl.textContent = 'Contame qué salió mal antes de guardar.'; return; }
      reportarBug(ctx, nota, msgEl, ev.currentTarget);
    });
  }catch(e){ out.innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>'; }
  finally{ btn.disabled = false; btn.textContent = 'Recalcular con código actual'; }
}

async function guardarCorreccion(ctx, textoCorregido, fueEditado, msgEl){
  msgEl.textContent = 'Guardando…';
  try{
    await rpc('correccion_guardar', {
      p_fuente: 'bot_logs', p_fuente_ref: ctx.turno.id,
      p_estado: ctx.estadoNuevo || ctx.dec.estado_destino || 'nuevo',
      p_intencion: (ctx.router && ctx.router.intencion) || null,
      p_polaridad: (ctx.router && ctx.router.polaridad) || null,
      p_acto: (ctx.router && ctx.router.acto) || null,
      p_mensaje_usuario: ctx.turno.mensaje || null,
      p_plantilla_base: ctx.plantillaBase, p_texto_bot: ctx.textoBot,
      p_texto_corregido: textoCorregido, p_fue_editado: fueEditado,
    });
    msgEl.textContent = fueEditado ? 'Corrección guardada ✅' : 'Aprobado tal cual ✅';
    correccionesYaHechas.add(ctx.turno.id);
    const badge = $('#corrBadge'+ctx.i);
    if(badge) badge.outerHTML = '<span id="corrBadge'+ctx.i+'" class="pill" style="background:var(--accent);color:#06251d">✅ ya corregido</span>';
  }catch(e){ msgEl.textContent = 'Error: '+e.message; }
}

async function reportarBug(ctx, nota, msgEl, btn){
  if(btn) btn.disabled = true;
  msgEl.textContent = 'Guardando reporte…';
  try{
    await rpc('bug_reportar', {
      p_fuente_ref: ctx.turno.id,
      p_telefono: ($('#corrTel')&&$('#corrTel').value) || null,
      p_estado: ctx.estadoNuevo || ctx.dec.estado_destino || null,
      p_mensaje_usuario: ctx.turno.mensaje || null,
      p_respuesta_bot: ctx.turno.respuesta_bot || null,
      p_nota: nota,
    });
    msgEl.textContent = 'Reporte guardado 🐞 (no afecta la memoria del bot)';
    correccionesBugYaHechas.add(ctx.turno.id);
    const badge = $('#corrBugBadge'+ctx.i);
    if(badge) badge.outerHTML = '<span id="corrBugBadge'+ctx.i+'" class="pill" style="background:#e0a030;color:#251c06">🐞 ya reportado</span>';
  }catch(e){ msgEl.textContent = 'Error: '+e.message; if(btn) btn.disabled = false; }
}

/* ================= FLOW ================= */
function showLogin(){ $('#appView').style.display='none'; $('#loginView').style.display='flex'; }
function showApp(){ $('#loginView').style.display='none'; $('#appView').style.display='block'; }

async function refresh(){
  $('#btnRefresh').disabled = true;
  try{
    STATS = await rpc('admin_dashboard_stats');
    Object.keys(loadedEvents).forEach(k=> delete loadedEvents[k]);
    renderAll();
    const active = document.querySelector('.tab-btn.active');
    loadEvents(active ? active.dataset.tab : 'resumen');
  } finally { $('#btnRefresh').disabled = false; }
}

async function boot(){
  buildShell();
  const tk = await freshToken();
  if(!tk){ showLogin(); return; }
  try{
    STATS = await rpc('admin_dashboard_stats');
    showApp(); renderAll(); openTab('resumen');
  }catch(e){ showLogin(); }
}

$('#loginBtn').addEventListener('click', async ()=>{
  const btn = $('#loginBtn'), err = $('#loginErr');
  btn.disabled = true; err.style.display = 'none';
  try{
    await login($('#logEmail').value.trim(), $('#logPass').value);
    STATS = await rpc('admin_dashboard_stats');
    showApp(); renderAll(); openTab('resumen');
  }catch(e){
    err.textContent = /forbidden|permis/i.test(e.message) ? 'Usuario sin permisos de administración.' : e.message;
    err.style.display = 'block';
  } finally { btn.disabled = false; }
});
$('#logPass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#loginBtn').click(); });
$('#btnRefresh').addEventListener('click', refresh);
$('#btnLogout').addEventListener('click', ()=>{ clearSession(); location.reload(); });

boot();
</script>
